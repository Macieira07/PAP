<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Verificar Disponibilidade</title>
</head>
<body>
    <h1>Verificar Disponibilidade da Quinta Flores</h1>

    <label for="checkin">Check-in:</label>
    <input type="date" id="checkin"><br><br>

    <label for="checkout">Check-out:</label>
    <input type="date" id="checkout"><br><br>

    <label for="guests">Nº de Hóspedes:</label>
    <input type="number" id="guests" min="1"><br><br>

    <button id="searchBtn">Verificar</button>

    <script>
        document.getElementById('searchBtn').addEventListener('click', async () => {
            const checkin = document.getElementById('checkin').value;
            const checkout = document.getElementById('checkout').value;
            const guests = document.getElementById('guests').value;

            try {
                const response = await fetch('disponibilidade.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ checkin, checkout, guests })
                });

                const data = await response.json();

                if (data.disponivel) {
                    alert(`Disponível! Preço total: €${data.casa.preco_total}`);
                } else {
                    alert(data.mensagem || data.error);
                }
            } catch (err) {
                alert("Erro: " + err.message);
            }
        });
    </script>
</body>
</html>
